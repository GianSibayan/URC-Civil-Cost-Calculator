<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Civil Cost Calculator</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <span class="header-tag">ESD · URC / JG Summit</span>
      <h1>Admin Panel</h1>
      <p class="header-sub">Price Reference Management</p>
    </div>
  </header>

  <main>

    <!-- Auth Gate -->
    <section class="card" id="authSection">
      <h2>Admin Access</h2>
      <div class="field">
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="Enter admin password" />
      </div>
      <button id="loginBtn">Login</button>
      <p id="authError" style="color: red; display:none;">Incorrect password.</p>
    </section>

    <!-- Admin Content (hidden until auth) -->
    <div id="adminContent" style="display:none;">

      <!-- Upload Excel -->
      <section class="card">
        <h2>Upload Price Reference Excel</h2>
        <p class="hint">Upload the latest Excel file to bulk-update all material prices.</p>
        <input type="file" id="excelUpload" accept=".xlsx, .xls" />
        <button id="uploadBtn">Parse & Apply Prices</button>
        <p id="uploadStatus"></p>
      </section>

      <!-- Edit Prices -->
      <section class="card">
        <h2>Edit Prices</h2>
        <input type="text" id="priceSearch" placeholder="Search material..." />
        <div id="priceList"></div>
      </section>

    </div>

  </main>

  <footer>
    <p>Civil Cost Calculator v0.1.0 — ESD Internship 2026 &nbsp;·&nbsp; <a href="index.html">← Back to Estimator</a></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="src/parser.js"></script>
  <script src="src/admin.js"></script>

</body>
</html>
