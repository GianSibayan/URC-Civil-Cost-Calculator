<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <link rel="icon" type="image/png" href="urclogo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil Cost Calculator — ESD / URC</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
            background-color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 999px; }

        .login-form {
            display: none;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 384px;
        }

        .login-form.visible {
            display: flex;
        }

        .login-input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            color: #111;
        }

        .login-input:focus {
            border-color: rgba(0,0,0,0.3);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
        }

        .login-input::placeholder {
            color: #bbb;
        }

        .error-msg {
            display: none;
            color: #ef4444;
            font-size: 13px;
            text-align: center;
        }

        .error-msg.visible {
            display: block;
        }

        #page-transition-circle {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: #000;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body class="h-full overflow-hidden select-none">

    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
    <div id="page-transition-circle"></div>

    <!-- ============================================================ -->
    <!-- LANDING PAGE                                                  -->
    <!-- ============================================================ -->
    <div id="page-landing" class="min-h-screen flex items-center justify-center p-4 bg-white transition-all duration-300 ease-in-out">
        <div class="flex flex-col items-center gap-6 w-full max-w-md">

            <!-- Title -->
            <div class="text-center">
                <img src="urclogo.png" alt="URC Logo" class="w-24 h-24 mx-auto mb-3 rounded-2xl object-cover shadow-sm">
                <h1 class="text-5xl font-semibold text-black leading-tight">Civil Cost Calculator</h1>
                <p class="text-neutral-500 text-base mt-2">Engineering Services Department</p>
            </div>

            <p class="text-2xl text-black text-center mt-2">What are we calculating today?</p>

            <!-- ============================================== -->
            <!-- LOGGED-IN VIEW: hub buttons + logout            -->
            <!-- Shown only when Auth.isLoggedIn() is true       -->
            <!-- ============================================== -->
            <div id="hub-buttons" class="hidden flex-col items-center gap-6 w-full">
                <button
                    onclick="navigateWithTransition('calculator.html', event)"
                    class="w-72 h-14 bg-zinc-100 hover:bg-zinc-200 transition-all cursor-pointer rounded-2xl shadow-md flex items-center justify-center active:scale-95 duration-150">
                    <span class="text-black text-lg font-semibold tracking-wide">Calculator</span>
                </button>

                <div id="divider-section" class="flex flex-col items-center gap-4 w-full max-w-sm">
                    <p class="text-zinc-500 text-base">Changing something?</p>
                    <button
                        onclick="navigateWithTransition('admin.html', event)"
                        class="w-72 h-14 bg-zinc-100 hover:bg-zinc-200 transition-all cursor-pointer rounded-2xl shadow-md flex items-center justify-center active:scale-95 duration-150">
                        <span class="text-black text-lg font-semibold tracking-wide">Access Price List</span>
                    </button>
                </div>

                <button
                    onclick="Auth.logout()"
                    class="w-72 h-10 px-4 bg-black rounded-lg flex justify-center items-center gap-2 cursor-pointer hover:bg-neutral-800 transition shadow-sm">
                    <span class="text-white text-base font-medium">Logout</span>
                </button>
            </div>

            <!-- ============================================== -->
            <!-- LOGGED-OUT VIEW: login form                     -->
            <!-- Shown only when Auth.isLoggedIn() is false      -->
            <!-- ============================================== -->
            <div id="login-form" class="login-form w-full max-w-sm">
                <p id="login-label" class="text-sm font-semibold text-neutral-600 text-center">Enter your URC credentials</p>
                <input
                    id="login-email"
                    class="login-input"
                    type="email"
                    placeholder="your.email@urc.com.ph"
                    autocomplete="email"
                />
                <input
                    id="login-password"
                    class="login-input"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    onkeydown="if(event.key==='Enter') submitLogin()"
                />
                <p id="login-error" class="error-msg">Invalid email or password. Please try again.</p>
                <button
                    onclick="submitLogin()"
                    id="login-btn"
                    class="w-full h-10 px-4 bg-black rounded-lg flex justify-center items-center gap-2 cursor-pointer hover:bg-neutral-800 transition shadow-sm">
                    <span class="text-white text-base font-medium">Login</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Load auth.js -->
    <script src="src/auth.js"></script>

    <script>
        // Login always redirects to the calculator by default.
        // Admin is reached via the hub AFTER login, not before.
        let loginDestination = 'page-landing';

        // Circle-reveal page transition, expanding from the click point
        function playTransition(x, y) {
            const circle = document.getElementById('page-transition-circle');
            const size = Math.hypot(window.innerWidth, window.innerHeight) * 2.2;
            circle.style.left = x + 'px';
            circle.style.top = y + 'px';
            circle.style.width = size + 'px';
            circle.style.height = size + 'px';
            circle.style.opacity = '1';
            circle.style.transform = 'translate(-50%, -50%) scale(0)';
            void circle.offsetWidth; // force reflow so the transition actually plays
            circle.style.transform = 'translate(-50%, -50%) scale(1)';
        }

        // Snap the circle back to invisible, e.g. after a failed login
        function resetTransition() {
            const circle = document.getElementById('page-transition-circle');
            circle.style.transition = 'none';
            circle.style.transform = 'translate(-50%, -50%) scale(0)';
            circle.style.opacity = '0';
            void circle.offsetWidth;
            circle.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease';
        }

        // Play the transition, then navigate once it's had time to cover the screen
        function navigateWithTransition(url, evt) {
            const x = evt ? evt.clientX : window.innerWidth / 2;
            const y = evt ? evt.clientY : window.innerHeight / 2;
            playTransition(x, y);
            setTimeout(() => { window.location.href = url; }, 420);
        }

        // Decide which view to show based on current auth state
        function renderAuthState() {
            const hub = document.getElementById('hub-buttons');
            const loginForm = document.getElementById('login-form');

            if (typeof Auth !== 'undefined' && Auth.isLoggedIn()) {
                hub.classList.remove('hidden');
                hub.classList.add('flex');
                loginForm.classList.remove('visible');
            } else {
                hub.classList.remove('flex');
                hub.classList.add('hidden');
                loginForm.classList.add('visible');
                setTimeout(() => document.getElementById('login-email')?.focus(), 100);
            }
        }

        // Submit login
        async function submitLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');

            if (!email || !password) {
                errorEl.textContent = 'Please enter your email and password.';
                errorEl.classList.add('visible');
                return;
            }

            // Loading state
            loginBtn.innerHTML = '<span class="text-white text-base font-medium">Logging in...</span>';
            loginBtn.disabled = true;
            errorEl.classList.remove('visible');

            const btnRect = loginBtn.getBoundingClientRect();
            playTransition(btnRect.left + btnRect.width / 2, btnRect.top + btnRect.height / 2);

            const result = await Auth.login(email, password, loginDestination);

            if (!result.success) {
                resetTransition();
                errorEl.textContent = result.error || 'Invalid email or password.';
                errorEl.classList.add('visible');
                loginBtn.innerHTML = '<span class="text-white text-base font-medium">Login</span>';
                loginBtn.disabled = false;
            }
            // On success, Auth.login() handles the redirect automatically
        }

        // Show toast
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'px-4 py-3 rounded-xl shadow-lg border text-sm font-semibold flex items-center gap-3 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto max-w-sm w-full bg-white';
            if (type === 'error') toast.classList.add('bg-rose-50', 'border-rose-100', 'text-rose-800');
            else if (type === 'info') toast.classList.add('bg-slate-50', 'border-neutral-100', 'text-slate-800');
            else toast.classList.add('border-neutral-200', 'text-neutral-900');
            toast.innerHTML = `<span>${message}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', renderAuthState);
    </script>

    <canvas id="pc" style="position:fixed;bottom:0;left:0;width:100%;height:55vh;pointer-events:none;z-index:0;"></canvas>
    <script>
    (function(){
        var c = document.getElementById('pc');
        var x = c.getContext('2d');
        var W, H, P = [], M = {x:-9999,y:-9999}, N = 55;

        function resize() {
            W = c.width = c.offsetWidth;
            H = c.height = c.offsetHeight;
        }

        function arcY(px) {
            var t = (px / W) * 2 - 1;
            return H * (0.55 - 0.55 * t * t);
        }

        function inZone(px, py) {
            return py > arcY(px);
        }

        function mk() {
            P = [];
            var attempts = 0;
            while (P.length < N && attempts < 1000) {
                attempts++;
                var px = Math.random() * W;
                var py = arcY(px) + Math.random() * (H - arcY(px));
                if (inZone(px, py)) {
                    P.push({x:px, y:py, vx:(Math.random()-.5)*.45, vy:(Math.random()-.5)*.45});
                }
            }
        }

        function fr() {
            x.clearRect(0, 0, W, H);

            for (var i = 0; i < P.length; i++) {
                var p = P[i];
                var dx = p.x - M.x, dy = p.y - M.y;
                var d = Math.sqrt(dx*dx+dy*dy);
                if (d < 85 && d > 0) {
                    var f = (85-d)/85*2;
                    p.vx += (dx/d)*f*.1;
                    p.vy += (dy/d)*f*.1;
                }

                p.vx *= .97; p.vy *= .97;
                if (Math.abs(p.vx)<.05) p.vx += (Math.random()-.5)*.1;
                if (Math.abs(p.vy)<.05) p.vy += (Math.random()-.5)*.1;

                p.x += p.vx; p.y += p.vy;

                var threshold = arcY(p.x);
                if (p.y < threshold) {
                    p.y = threshold;
                    p.vy = Math.abs(p.vy) * .6;
                }

                if (p.x < 0) { p.x = 0; p.vx *= -1; }
                if (p.x > W) { p.x = W; p.vx *= -1; }
                if (p.y > H) { p.y = H; p.vy *= -1; }
            }

            for (var i = 0; i < P.length; i++) {
                for (var j = i+1; j < P.length; j++) {
                    var dx = P[i].x-P[j].x, dy = P[i].y-P[j].y;
                    var d = Math.sqrt(dx*dx+dy*dy);
                    if (d < 100) {
                        x.beginPath();
                        x.moveTo(P[i].x, P[i].y);
                        x.lineTo(P[j].x, P[j].y);
                        x.strokeStyle = 'rgba(0,0,0,'+(1-d/100)*.18+')';
                        x.lineWidth = .8;
                        x.stroke();
                    }
                }
            }

            for (var i = 0; i < P.length; i++) {
                x.beginPath();
                x.arc(P[i].x, P[i].y, 2.5, 0, 6.28);
                x.fillStyle = 'rgba(0,0,0,.22)';
                x.fill();
            }

            requestAnimationFrame(fr);
        }

        window.addEventListener('mousemove', function(e) {
            var r = c.getBoundingClientRect();
            M.x = e.clientX - r.left;
            M.y = e.clientY - r.top;
        });
        window.addEventListener('touchmove', function(e) {
            var t = e.touches[0], r = c.getBoundingClientRect();
            M.x = t.clientX - r.left;
            M.y = t.clientY - r.top;
        }, {passive:true});
        window.addEventListener('mouseleave', function() { M.x=-9999; M.y=-9999; });
        window.addEventListener('resize', function() { resize(); mk(); });

        resize();
        mk();
        fr();
    })();
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Offline Engine Active: ', reg.scope))
                .catch(err => console.error('Offline Engine Failed: ', err));
        });
    }
</script>
</body>
</html>
