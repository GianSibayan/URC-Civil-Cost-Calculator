    <script>
        // ============================================================
        // 1. MATERIAL CART LOGIC (RESTORED)
        // ============================================================
        // ============================================================
        // ESCALATION — mirrors admin.html logic exactly
        // Reads active_year + year_rates from prices.json meta.
        // Database JSONs always store 2026 base values unchanged.
        // ============================================================
        const BASE_YEAR = 2026;
        let PRICES_META = null;

        async function loadPricesMeta() {
            try {
                let res = await fetch('/prices.json');
                if (!res.ok) throw new Error('relative failed');
                PRICES_META = await res.json();
            } catch (_) {
                try {
                    const res = await fetch('https://raw.githubusercontent.com/GianSibayan/URC-Civil-Cost-Calculator/main/prices.json');
                    if (res.ok) PRICES_META = await res.json();
                } catch (e) { console.error('Could not load prices.json meta:', e); }
            }
        }

        function getYearMultiplier() {
            const meta      = PRICES_META?.meta;
            const activeYear = meta?.active_year ?? BASE_YEAR;
            const rates     = meta?.year_rates   ?? {};
            const rate      = rates[activeYear]  ?? 10;
            const steps     = activeYear - BASE_YEAR;
            return { multiplier: Math.pow(1 + rate / 100, steps), activeYear, rate, steps };
        }

        function scalePrice(basePrice) {
            const { multiplier } = getYearMultiplier();
            return Math.round(basePrice * multiplier * 100) / 100;
        }

        const DB_CONFIG = [
            { id: 'concreting_materials', file: 'data/concreting_materials.json', schema: 'simple', label: 'Concreting Materials' },
            { id: 'timber_formworks', file: 'data/timber_formworks.json', schema: 'simple', label: 'Timber Formworks' },
            { id: 'roofing', file: 'data/roofing.json', schema: 'simple', label: 'Roofing' },
            { id: 'steel_truss', file: 'data/steel_truss.json', schema: 'simple', label: 'Steel Truss' },
            { id: 'painting_works', file: 'data/painting_works.json', schema: 'simple', label: 'Painting Works' },
            { id: 'electrical', file: 'data/electrical.json', schema: 'simple', label: 'Electrical' },
            { id: 'masonry', file: 'data/masonry.json', schema: 'masonry', label: 'Masonry' },
            { id: 'fencing', file: 'data/fencing.json', schema: 'simple', label: 'Fencing' },
            { id: 'ceiling', file: 'data/ceiling.json', schema: 'simple', label: 'Ceiling' },
            { id: 'plumbing', file: 'data/plumbing.json', schema: 'simple', label: 'Plumbing' },
            { id: 'rebars', file: 'data/rebars.json', schema: 'rebars', label: 'Rebars' },
            { id: 'concrete_mix', file: 'data/concrete_mix.json', schema: 'concrete_mix', label: 'Concrete Mix' },
            { id: 'equipment', file: 'data/equipment.json', schema: 'equipment', label: 'Equipment' },
            { id: 'pipes', file: 'data/pipes.json', schema: 'pipes', label: 'Pipes' }
        ];

        let MASTER_DB = {}; 
        let cart = []; 

        async function fetchAllDatabases() {
            const statusEl = document.getElementById('db-status');
            let loadedCount = 0;

            await Promise.all(DB_CONFIG.map(async (config) => {
                const urls = [
                    `/${config.file}`,
                    `https://raw.githubusercontent.com/GianSibayan/URC-Civil-Cost-Calculator/main/${config.file}`
                ];

                for (const url of urls) {
                    try {
                        const res = await fetch(url);
                        if (res.ok) {
                            const rawData = await res.json();
                            normalizeMaterialData(config, rawData);
                            loadedCount++;
                            break; 
                        }
                    } catch (e) {}
                }
            }));

            populateMaterialCategoryDropdown();

            if (loadedCount > 0) {
                statusEl.textContent = `Live DB Active (${loadedCount} modules loaded)`;
                statusEl.className = "text-xs font-semibold text-emerald-600 mt-1";
            } else {
                statusEl.textContent = "Offline Mode: No materials loaded.";
                statusEl.className = "text-xs font-semibold text-rose-500 mt-1";
            }
        }

        function normalizeMaterialData(config, data) {
            if (!data) return;
            const addEntry = (id, name, price, unit) => {
                MASTER_DB[id] = { name, price: price || 0, unit: unit || 'unit', category: config.id };
            };

            try {
                if (config.schema === 'simple') {
                    data.forEach((item, idx) => addEntry(`${config.id}_${idx}`, item.name, scalePrice(item.price_php), item.unit));
                } else if (config.schema === 'masonry' && data.prices) {
                    data.prices.forEach((item, idx) => addEntry(`${config.id}_${idx}`, item.name, scalePrice(item.price_php), item.unit));
                } else if (config.schema === 'rebars') {
                    data.forEach((item, idx) => addEntry(`${config.id}_${idx}`, `${item.spec} - ${item.size} (${item.length})`, scalePrice(item.price_php), "pc"));
                } else if (config.schema === 'concrete_mix') {
                    data.forEach((item, idx) => addEntry(`${config.id}_${idx}`, `${item.product} (${item.curing_time})`, scalePrice(item.price_php), "cu.m"));
                } else if (config.schema === 'equipment') {
                    data.forEach((item, idx) => addEntry(`${config.id}_${idx}`, `[${item.category}] ${item.name}`, scalePrice(item.rate_min_php), item.unit));
                } else if (config.schema === 'pipes') {
                    let pipeIdx = 0;
                    if (data.nominal_size_unit_price) data.nominal_size_unit_price.forEach(item => addEntry(`pipes_${pipeIdx++}`, `Nominal Size: ${item.english} (${item.metric_mm}mm)`, scalePrice(item.price_per_6m_php), "6m"));
                    if (data.seamless_galvanized_steel) data.seamless_galvanized_steel.forEach(item => addEntry(`pipes_${pipeIdx++}`, `Seamless: ${item.description}`, scalePrice(item.price_per_length_php), "length"));
                    if (data.erw_welded_galvanized_steel) data.erw_welded_galvanized_steel.forEach(item => addEntry(`pipes_${pipeIdx++}`, `ERW Welded: ${item.description}`, scalePrice(item.price_per_length_php), "length"));
                }
            } catch (error) { console.error(error); }
        }

        function populateMaterialCategoryDropdown() {
            const select = document.getElementById('material-category-selector');
            DB_CONFIG.forEach(config => {
                if (Object.values(MASTER_DB).some(mat => mat.category === config.id)) {
                    const option = document.createElement('option');
                    option.value = config.id;
                    option.textContent = config.label;
                    select.appendChild(option);
                }
            });
        }

        function updateMaterialDropdown() {
            const catId = document.getElementById('material-category-selector').value;
            const container = document.getElementById('material-checkbox-list');
            container.innerHTML = ''; 

            if (!catId) {
                container.innerHTML = '<div class="text-neutral-400 text-center italic mt-6">Select a category first...</div>';
                return;
            }
            
            for (const [key, mat] of Object.entries(MASTER_DB)) {
                if (mat.category === catId) {
                    const label = document.createElement('label');
                    label.className = "flex items-start gap-3 p-2 hover:bg-neutral-50 rounded cursor-pointer border border-transparent hover:border-neutral-200 transition-colors";
                    label.innerHTML = `
                        <input type="checkbox" value="${key}" class="mt-0.5 material-checkbox w-4 h-4 text-blue-600 rounded border-neutral-300 focus:ring-blue-500 cursor-pointer">
                        <div class="flex-1 select-none">
                            <div class="font-medium text-neutral-800 leading-tight">${mat.name}</div>
                            <div class="text-xs text-blue-600 font-semibold mt-0.5">₱${mat.price.toLocaleString(undefined, {minimumFractionDigits: 2})} <span class="text-neutral-400 font-normal">/ ${mat.unit}</span></div>
                        </div>
                    `;
                    container.appendChild(label);
                }
            }
        }

        function addSelectedToCart() {
            const checkboxes = document.querySelectorAll('.material-checkbox:checked');
            if (checkboxes.length === 0) return alert("Please check at least one material to add.");

            let addedCount = 0;
            checkboxes.forEach(cb => {
                if (!cart.find(item => item.materialId === cb.value)) {
                    cart.push({ id: Date.now().toString() + Math.random().toString(36).substr(2, 5), materialId: cb.value, quantity: 0 });
                    addedCount++;
                }
                cb.checked = false; 
            });

            if (addedCount === 0) alert("The selected materials are already in your cart!");
            else renderCart();
        }

        function removeFromCart(cartItemId) {
            cart = cart.filter(item => item.id !== cartItemId);
            renderCart();
        }

        function updateCartItemQuantity(cartItemId, newQuantity) {
            const item = cart.find(item => item.id === cartItemId);
            if (item) {
                item.quantity = parseFloat(newQuantity) || 0;
                renderCart();
            }
        }

        function renderCart() {
            const cartContainer = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            let cartTotal = 0;

            cartContainer.innerHTML = '';

            if (cart.length === 0) {
                cartContainer.appendChild(emptyMsg);
                document.getElementById('cart-grand-total').textContent = '₱0.00';
                emptyMsg.style.display = 'block';
                return;
            }

            cart.forEach(item => {
                const material = MASTER_DB[item.materialId];
                if (!material) return; 

                const totalCost = item.quantity * material.price;
                cartTotal += totalCost;

                const div = document.createElement('div');
                div.className = "bg-white p-3.5 rounded-xl border border-neutral-200 shadow-sm relative group transition-all";
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="text-sm font-bold text-neutral-900 pr-4 leading-tight">${material.name}</div>
                        <button onclick="removeFromCart('${item.id}')" class="text-neutral-300 hover:text-red-500 transition opacity-0 group-hover:opacity-100 bg-white rounded-full p-0.5">✕</button>
                    </div>
                    <div class="flex items-center justify-between mt-2 pt-2 border-t border-neutral-100">
                        <div class="flex items-center gap-2">
                            <input type="number" min="0" value="${item.quantity || ''}" placeholder="0" 
                                   oninput="updateCartItemQuantity('${item.id}', this.value)" 
                                   class="w-16 px-2 py-1 text-sm text-center border border-neutral-300 rounded focus:border-blue-500 outline-none" />
                            <span class="text-xs text-neutral-500 font-medium">${material.unit}</span>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] text-neutral-400">@ ₱${material.price.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                            <div class="text-sm font-black text-neutral-800">₱${totalCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(div);
            });

            document.getElementById('cart-grand-total').textContent = `₱${cartTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        // ============================================================
        // 2. DYNAMIC SCOPE TABLES LOGIC
        // ============================================================
        
        const commonShell = [
            { code: "105", desc: "Excavation & Fill" }, { code: "110", desc: "Foundations" }, { code: "115", desc: "Superstructure Slabs" },
            { code: "120", desc: "Slab on Grade" }, { code: "125", desc: "Floor and wall caulk" }, { code: "130", desc: "Frame - Steel" },
            { code: "135", desc: "Frame - Concrete, steel, wood (incl. Stairs)" }, { code: "140", desc: "Roof Deck" }, { code: "150", desc: "Roofing & Sheetmetal" },
            { code: "155", desc: "Platforms" }, { code: "160", desc: "Siding" }, { code: "165", desc: "Exterior Wall" },

            { code: "180", desc: "Windows and Doors" }, { code: "185", desc: "Truck Doors" }, { code: "190", desc: "Painting Exterior Walls" },
            { code: "195", desc: "Stair and Elevator Enclosures" }, { code: "199", desc: "Others" }
        ];

        const commonInterior = [
            { code: "210", desc: "Partitions" }, { code: "215", desc: "Office Shell" }, { code: "220", desc: "Interior Window / Window Glazing" },
            { code: "230", desc: "Walls Finishes" }, { code: "235", desc: "Flooring" }, { code: "240", desc: "Floor Sealer" },
            { code: "245", desc: "Doors" }, { code: "250", desc: "Ceiling" }, { code: "260", desc: "Built-in Items (Carpentry)" },
            { code: "270", desc: "Specialties" }, { code: "299", desc: "Others" }
        ];

        const commonMechanical = [
            { code: "310", desc: "HVAC incl. System Ancillaries, Chiller and Cooling Tower" }, { code: "320", desc: "Plumbing" },
            { code: "330", desc: "Fire Protection (Sprinkler System, Smoke Exhaust System)" }, { code: "340", desc: "Fire Hose Racks" },
            { code: "350", desc: "Laboratory Utilities" }, { code: "360", desc: "Elevators, Escalators" }, { code: "399", desc: "Others" }
        ];

        const commonElectrical = [
            { code: "410", desc: "Lighting" }, { code: "420", desc: "Power Wiring" }, { code: "430", desc: "Communications Syst. (incl. Phone and Computer Wiring)" },
            { code: "440", desc: "Building Grounding" }, { code: "450", desc: "Security" }, { code: "499", desc: "Other" }
        ];

        const SCOPE_CATEGORIES = [
            {
                id: "yard-underground", label: "Yard & Underground",
                sections: [{
                    title: "Yard & Underground", color: "bg-blue-50 text-blue-800",
                    items: [
                        { code: "1", desc: "Site grading & drainage" }, { code: "2", desc: "Landscaping" }, { code: "3", desc: "Retention Basins / Storm water" },
                        { code: "4", desc: "Fire Loop and hydrants" }, { code: "5", desc: "Fire Water Tank, pumps" }, { code: "6", desc: "Paving - Roadway" },
                        { code: "7", desc: "Paving - Parking Lot" }, { code: "8", desc: "Paving - Truck Dock" }, { code: "9", desc: "Outdoor Lighting" },
                        { code: "10", desc: "Fencing" }, { code: "11", desc: "Railroad Sidings" }, { code: "12", desc: "Truck Scales" },
                        { code: "13", desc: "Site Security" }, { code: "14", desc: "Fire road" }, { code: "15", desc: "Other" }
                    ]
                }]
            },
            {
                id: "yard-utilities", label: "Yard Utilities",
                sections: [{
                    title: "Yard Utilities", color: "bg-blue-50 text-blue-800",
                    items: [{ code: "1", desc: "Potable Water" }, { code: "2", desc: "City Water" }, { code: "3", desc: "Sanitary Sewer" }, { code: "4", desc: "Gas - Natural" }]
                }]
            },
            {
                id: "plant-utilities", label: "Plant Utilities",
                sections: [{
                    title: "Plant Utilities", color: "bg-blue-50 text-blue-800",
                    items: [{ code: "1", desc: "Hot Water" }, { code: "2", desc: "Steam" }, { code: "3", desc: "Process Sewer" }, { code: "4", desc: "Gas - LPG" }, { code: "5", desc: "Fuel Oil" }]
                }]
            },
            {
                id: "substation", label: "Substation & Power",
                sections: [{
                    title: "Substation and Primary Power Distribution", color: "bg-blue-50 text-blue-800",
                    items: [{ code: "1", desc: "Power - High Voltage" }, { code: "2", desc: "Substation/PDP/LV Powerfeed" }, { code: "3", desc: "Backup Generator" }]
                }]
            },
            {
                id: "rm-warehouse", label: "RM Warehouse",
                sections: [
                    { title: "Building Shell", color: "bg-emerald-50 text-emerald-800", prefix: "", items: commonShell },
                    { title: "Interior Finishing", color: "bg-purple-50 text-purple-800", prefix: "", items: commonInterior },
                    { title: "Building Mechanical", color: "bg-orange-50 text-orange-800", prefix: " RMW", items: commonMechanical },
                    { title: "Building Electrical", color: "bg-sky-50 text-sky-800", prefix: " RMW", items: commonElectrical }
                ]
            },
            {
                id: "making", label: "Making",
                sections: [
                    { title: "Building Shell", color: "bg-emerald-50 text-emerald-800", prefix: " MAK", items: commonShell },
                    { title: "Interior Finishing", color: "bg-purple-50 text-purple-800", prefix: " MAK", items: commonInterior },
                    { title: "Building Mechanical", color: "bg-orange-50 text-orange-800", prefix: " MAK", items: commonMechanical },
                    { title: "Building Electrical", color: "bg-sky-50 text-sky-800", prefix: " MAK", items: commonElectrical }
                ]
            },
            {
                id: "converting", label: "Converting",
                sections: [
                    { title: "Building Shell", color: "bg-emerald-50 text-emerald-800", prefix: " Conv", items: commonShell },
                    { title: "Interior Finishing", color: "bg-purple-50 text-purple-800", prefix: " Conv", items: commonInterior },
                    { title: "Building Mechanical", color: "bg-orange-50 text-orange-800", prefix: " Conv", items: commonMechanical },
                    { title: "Building Electrical", color: "bg-sky-50 text-sky-800", prefix: " Conv", items: commonElectrical }
                ]
            },
            {
                id: "pub", label: "PUB",
                sections: [
                    { title: "Building Shell", color: "bg-emerald-50 text-emerald-800", prefix: " PUB", items: commonShell },
                    { title: "Interior Finishing", color: "bg-purple-50 text-purple-800", prefix: " PUB", items: commonInterior },
                    { title: "Building Mechanical", color: "bg-orange-50 text-orange-800", prefix: " PUB", items: commonMechanical },
                    { title: "Building Electrical", color: "bg-sky-50 text-sky-800", prefix: " PUB", items: commonElectrical }
                ]
            },
            {
                id: "admin", label: "Admin Building",
                sections: [
                    { title: "Building Shell", color: "bg-emerald-50 text-emerald-800", prefix: " Admin", items: commonShell },
                    { title: "Interior Finishing", color: "bg-purple-50 text-purple-800", prefix: " Admin", items: commonInterior },
                    { title: "Building Mechanical", color: "bg-orange-50 text-orange-800", prefix: " Admin", items: commonMechanical },
                    { title: "Building Electrical", color: "bg-sky-50 text-sky-800", prefix: " Admin", items: commonElectrical }
                ]
            },
            {
                id: "others", label: "Others & Management",
                sections: [
                    { title: "Others (Equipment)", color: "bg-yellow-50 text-yellow-800", items: [{code:"510",desc:"Truck Dock Doors/Levelers"}, {code:"520",desc:"Furnishings"}, {code:"530",desc:"Canopies"}, {code:"940",desc:"Racks"}, {code:"950",desc:"Warehouse Management System"}] },
                    { title: "Other Buildings", color: "bg-stone-50 text-stone-800", items: [{code:"610",desc:"Transformer Building"}, {code:"620",desc:"Guard House"}, {code:"630",desc:"Fire Pump House"}, {code:"640",desc:"Boiler House"}, {code:"650",desc:"Flammable Material Storage"}, {code:"660",desc:"Empty Pallet Storage"}, {code:"670",desc:"Scrap Building"}, {code:"680",desc:"Cafeteria"}, {code:"690",desc:"Waste Water Treatment"}, {code:"699",desc:"Others"}] },
                    { title: "Engineering & Construction", color: "bg-indigo-50 text-indigo-800", items: [{code:"Const",desc:"Construction Management (Temp facilities, permits)"}, {code:"Com",desc:"Commissioning"}, {code:"Con Eng",desc:"Contractor Engineering"}, {code:"Plant Eng",desc:"Plant Engineering"}, {code:"PG Eng",desc:"P&G Engineering"}] },
                    { title: "Risk Funds", color: "bg-rose-50 text-rose-800", items: [{code:"Und",desc:"Undefined"}, {code:"Cont",desc:"Contingency"}, {code:"Pot",desc:"Potential Items"}] },
                    { title: "Operational Taxes & Prem", color: "bg-neutral-100 text-neutral-800", items: [{code:"Main",desc:"Maintaining Production"}, {code:"Prem",desc:"Premium Time"}, {code:"Tax",desc:"Taxes"}] }
                ]
            }
        ];

        let activeTabId = SCOPE_CATEGORIES[0].id;
        let categoryTotals = {}; 

        document.addEventListener("DOMContentLoaded", async () => {
            await loadPricesMeta();  // must complete first so scalePrice() has meta
            fetchAllDatabases(); // Initialize DB for Cart
            initTotals(); // Initialize Totals for Scope
            renderNavigation();
            renderContent();
        });

        function initTotals() { SCOPE_CATEGORIES.forEach(cat => categoryTotals[cat.id] = 0); }

        function renderNavigation() {
            const navContainer = document.getElementById('tab-nav-container');
            navContainer.innerHTML = '';

            SCOPE_CATEGORIES.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-nav-btn px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-2 ${cat.id === activeTabId ? 'bg-black text-white shadow-sm' : 'bg-white text-neutral-600 border border-neutral-200 hover:bg-neutral-50'}`;
                btn.dataset.id = cat.id;
                btn.onclick = () => switchTab(cat.id);
                
                const badge = document.createElement('span');
                badge.id = `badge-${cat.id}`;
                badge.className = `text-[10px] px-1.5 py-0.5 rounded-md ${cat.id === activeTabId ? 'bg-white/20 text-white' : 'bg-neutral-100 text-neutral-500'}`;
                badge.textContent = '₱0';

                btn.appendChild(document.createTextNode(cat.label));
                btn.appendChild(badge);
                navContainer.appendChild(btn);
            });
        }

        function renderContent() {
            const contentArea = document.getElementById('dynamic-content-area');
            contentArea.innerHTML = '';

            const activeCategory = SCOPE_CATEGORIES.find(c => c.id === activeTabId);
            if (!activeCategory) return;

            const headerDiv = document.createElement('div');
            headerDiv.className = "mb-6 flex justify-between items-end";
            headerDiv.innerHTML = `
                <div>
                    <h3 class="text-2xl font-bold text-neutral-900">${activeCategory.label}</h3>
                    <p class="text-sm text-neutral-500 mt-1">Enter estimated costs for each scope item below.</p>
                </div>
                <div class="text-right">
                    <div class="text-xs font-bold text-neutral-400 uppercase">Category Total</div>
                    <div class="text-2xl font-black text-blue-600" id="display-total-${activeCategory.id}">₱${categoryTotals[activeCategory.id].toLocaleString()}</div>
                </div>
            `;
            contentArea.appendChild(headerDiv);

            activeCategory.sections.forEach((section, secIdx) => {
                const sectionWrapper = document.createElement('div');
                sectionWrapper.className = "mb-8 bg-white border border-neutral-200/80 rounded-xl overflow-hidden shadow-sm tab-content";
                
                let tbodyHTML = section.items.map((item, i) => {
                    const displayCode = item.code + (section.prefix || '');
                    return `
                        <tr class="border-b border-neutral-100 hover:bg-neutral-50 transition-colors">
                            <td class="py-2.5 px-4 text-center text-xs font-semibold text-neutral-400 w-20">${displayCode}</td>
                            <td class="py-2.5 px-4 text-sm text-neutral-800 font-medium">${item.desc}</td>
                            <td class="py-2 px-4 w-40">
                                <div class="relative">
                                    <span class="absolute left-3 top-1.5 text-neutral-400 text-sm">₱</span>
                                    <input type="number" min="0" placeholder="0" class="dim-input scope-input pl-8" 
                                           data-category="${activeCategory.id}" 
                                           oninput="calculateTotals('${activeCategory.id}')" />
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

                sectionWrapper.innerHTML = `
                    <div class="px-4 py-3 ${section.color} border-b border-neutral-200/50 flex justify-between items-center">
                        <h4 class="font-bold text-sm tracking-wide uppercase">${section.title}</h4>
                    </div>
                    <table class="w-full text-left border-collapse">
                        <tbody class="bg-white">${tbodyHTML}</tbody>
                    </table>
                `;
                contentArea.appendChild(sectionWrapper);
            });
        }

        function switchTab(tabId) {
            activeTabId = tabId;
            renderNavigation();
            renderContent();
        }

        function filterCategories() {
            const query = document.getElementById('category-search').value.toLowerCase();
            const btns = document.querySelectorAll('.cat-nav-btn');
            btns.forEach(btn => {
                const text = btn.textContent.toLowerCase();
                btn.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        function calculateTotals(catId) {
            const inputs = document.querySelectorAll(`.scope-input[data-category="${catId}"]`);
            let sum = 0;
            inputs.forEach(input => {
                const val = parseFloat(input.value);
                if (!isNaN(val)) sum += val;
            });

            categoryTotals[catId] = sum;
            
            const displayTotal = document.getElementById(`display-total-${catId}`);
            if (displayTotal) displayTotal.textContent = `₱${sum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits:2})}`;
            
            const badge = document.getElementById(`badge-${catId}`);
            if (badge) badge.textContent = `₱${formatCompact(sum)}`;
        }

        function formatCompact(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num;
        }

        function openSummary() {
            const modal = document.getElementById('summary-modal');
            const modalContent = document.getElementById('summary-modal-content');
            const listDiv = document.getElementById('summary-list');
            let scopeGrandTotal = 0;

            listDiv.innerHTML = '';

            SCOPE_CATEGORIES.forEach(cat => {
                const val = categoryTotals[cat.id] || 0;
                scopeGrandTotal += val;
                
                listDiv.innerHTML += `
                    <div class="flex justify-between items-center py-3 border-b border-neutral-100 last:border-0">
                        <span class="text-sm font-medium text-neutral-700">${cat.label}</span>
                        <span class="text-sm font-bold text-neutral-900">₱${val.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                    </div>
                `;
            });

            document.getElementById('modal-grand-total').textContent = `₱${scopeGrandTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function goBackMain() {
            document.body.style.transition = 'opacity 0.2s';
            document.body.style.opacity = '0';
            setTimeout(() => { Auth.logout(); }, 200);
        }

        function closeSummary() {
            const modal = document.getElementById('summary-modal');
            const modalContent = document.getElementById('summary-modal-content');
            
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

    </script>
</body>
</html>
