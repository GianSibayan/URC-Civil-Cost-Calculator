<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URC CCC — Building Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: [
                            'Inter',
                            '-apple-system',
                            'BlinkMacSystemFont',
                            '"SF Pro"',
                            '"SF Pro Text"',
                            '"SF Pro Display"',
                            '"Segoe UI"',
                            'Roboto',
                            'Helvetica',
                            'Arial',
                            'sans-serif'
                        ]
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
            background-color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 999px; }
    </style>
</head>
<body class="h-full overflow-hidden select-none">

    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="page-menu" class="min-h-screen flex items-center justify-center p-4 bg-white transition-all duration-300 ease-in-out">
        <div class="flex flex-col items-center gap-6 w-full max-w-md">
            <h1 class="text-5xl font-semibold text-black text-center leading-tight">Civil Cost Calculator</h1>
            <p class="text-2xl text-black text-center">What are we calculating today?</p>
            <button onclick="openCalculator()" class="w-72 h-14 bg-zinc-100 hover:bg-zinc-200 transition-all cursor-pointer rounded-2xl shadow-md flex items-center justify-center active:scale-95 duration-150">
                <span class="text-black text-lg font-semibold tracking-wide">Calculator</span>
            </button>
            <p class="text-zinc-500 text-base mt-2">Changing something?</p>
            <button onclick="showToast('Connecting to URC SSO Portal...', 'info')" class="w-full max-w-sm h-10 px-4 bg-black rounded-lg flex justify-center items-center gap-2 cursor-pointer hover:bg-neutral-800 transition shadow-sm">
                <span class="text-white text-base font-medium">Login with URC email</span>
            </button>
            <div class="w-full max-w-sm flex justify-center items-center gap-3">
                <div class="flex-1 h-px bg-neutral-200"></div>
                <span class="text-zinc-500 text-base whitespace-nowrap">No Account?</span>
                <div class="flex-1 h-px bg-neutral-200"></div>
            </div>
            <button onclick="showToast('Sign up is currently unavailable.', 'error')" class="w-full max-w-sm h-10 bg-zinc-100 hover:bg-zinc-200 transition rounded-lg cursor-pointer flex items-center justify-center border border-zinc-200">
                <span class="text-black text-base font-medium">Sign up</span>
            </button>
        </div>
    </div>

    <script>
        function openCalculator() {
            const menu = document.getElementById('page-menu');
            menu.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                window.location.href = 'calculator.html';
            }, 300);
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'px-4 py-3 rounded-xl shadow-lg border text-sm font-semibold flex items-center gap-3 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto max-w-sm w-full bg-white';
            if (type === 'error') toast.classList.add('bg-rose-50','border-rose-100','text-rose-800');
            else if (type === 'info') toast.classList.add('bg-slate-50','border-neutral-100','text-slate-800');
            else toast.classList.add('border-neutral-200','text-neutral-900');
            toast.innerHTML = `<span>${message}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2','opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0','scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
