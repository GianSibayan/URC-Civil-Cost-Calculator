        document.addEventListener("DOMContentLoaded", async () => {
            loadFromCache();

        async function fetchLaborRates() {
            const urls = [
                '/data/labor_rates.json',
                'https://raw.githubusercontent.com/GianSibayan/URC-Civil-Cost-Calculator/main/data/labor_rates.json'
            ];
            
            let loaded = false;
            for (const url of urls) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const rawData = await res.json();
                        if (Array.isArray(rawData)) {
                            rawData.forEach(item => { LABOR_DB[item.id] = { name: item.name, dailyRate: item.rate || item.dailyRate }; });
                        } else {
                            Object.keys(rawData).forEach(key => { LABOR_DB[key] = { name: rawData[key].name || key, dailyRate: rawData[key].rate || rawData[key].dailyRate }; });
                        }
                        loaded = true;
                        break;
                    }
                } catch (e) { }
            }

            if (!loaded) {
                LABOR_DB = {
                    ncr: { name: 'NCR Region', dailyRate: 695 }, visayas: { name: 'Visayas Region', dailyRate: 500 },
                    mindanao: { name: 'Mindanao Region', dailyRate: 500 }, carpenter: { name: 'Carpenter', dailyRate: 700 },
                    mason: { name: 'Mason', dailyRate: 700 }, welder: { name: 'Welder', dailyRate: 815 },
                    electrician: { name: 'Electrician', dailyRate: 875 }, plumber: { name: 'Plumber', dailyRate: 700 },
                    pipeFitter: { name: 'Pipe Fitter', dailyRate: 700 }, civilEng: { name: 'Civil Engineer', dailyRate: 2700 },
                    electricalEng:{ name: 'Electrical Engineer', dailyRate: 2100 }, mechanicalEng:{ name: 'Mechanical Engineer', dailyRate: 2500 },
                    generalEng: { name: 'General Engineer', dailyRate: 1700 }, itEng: { name: 'IT / Software Engineer', dailyRate: 2500 },
                    consultant: { name: 'Consultant', dailyRate: 5000 }
                };
            }
        }

        async function fetchAllDatabases() {
            await Promise.all(DB_CONFIG.map(async (config) => {
                const urls = [ `/${config.file}`, `https://raw.githubusercontent.com/GianSibayan/URC-Civil-Cost-Calculator/main/${config.file}` ];
                for (const url of urls) {
                    try {
                        const res = await fetch(url);
                        if (res.ok) {
                            const rawData = await res.json();
                            normalizeMaterialData(config, rawData);
                            break;
                        }
                    } catch (e) { }
                }
            }));
        }

        function normalizeMaterialData(config, data) {
            const addEntry = (id, name, price, unit) => {
                MASTER_DB[id] = { name, price: price || 0, unit: unit || 'unit', category: config.id };
            };
            if (config.schema === 'simple') data.forEach((item, idx) => addEntry(`${config.id}_${idx}`, item.name, item.price_php, item.unit));
            else if (config.schema === 'masonry') data.prices.forEach((item, idx) => addEntry(`${config.id}_${idx}`, item.name, item.price_php, item.unit));
            else if (config.schema === 'rebars') data.forEach((item, idx) => addEntry(`${config.id}_${idx}`, `${item.spec} - ${item.size}`, item.price_php, "pc"));
            else if (config.schema === 'concrete_mix') data.forEach((item, idx) => addEntry(`${config.id}_${idx}`, `${item.product} (${item.curing_time})`, item.price_php, "cu.m"));
            else if (config.schema === 'equipment') data.forEach((item, idx) => addEntry(`${config.id}_${idx}`, `[${item.category}] ${item.name}`, item.rate_min_php, item.unit));
            else if (config.schema === 'pipes') {
                let pipeIdx = 0;
                if (data.nominal_size_unit_price) data.nominal_size_unit_price.forEach(item => addEntry(`pipes_${pipeIdx++}`, `Nominal Size: ${item.english}`, item.price_per_6m_php, "6m"));
            }
        }

        // ============================================================
        
        function getMaterialOptionsHTML(selectedId) {
            let html = '<option value="">- Select Material -</option>';
            DB_CONFIG.forEach(cfg => {
                const items = Object.keys(MASTER_DB).filter(k => MASTER_DB[k].category === cfg.id);
                if (items.length > 0) {
                    html += `<optgroup label="${cfg.label}">`;
                    items.forEach(k => {
                        const sel = k === selectedId ? ' selected' : '';
                        html += `<option value="${k}"${sel}>${MASTER_DB[k].name} (₱${MASTER_DB[k].price}/${MASTER_DB[k].unit})</option>`;
                    });
                    html += `</optgroup>`;
                }
            });
            return html;
        }

        function getLaborOptionsHTML(selectedId) {
            let html = '<option value="">- Select Role -</option>';
            Object.keys(LABOR_DB).forEach(k => {
                const rate = (LABOR_DB[k].dailyRate / 8).toFixed(2);
                const sel = k === selectedId ? ' selected' : '';
                html += `<option value="${k}"${sel}>${LABOR_DB[k].name} (₱${rate}/hr)</option>`;
            });
            return html;
        }

        function computeLineCost(line) {
            let matCost = 0, unitStr = '-';
            if (line && line.matId) {
                const mat = MASTER_DB[line.matId];
                if (mat) {
                    unitStr = mat.unit;
                    if (line.matQty && parseFloat(line.matQty) > 0) matCost = mat.price * parseFloat(line.matQty);
                }
            }
            let labCost = 0;
            if (line && line.labId && line.labHrs && parseFloat(line.labHrs) > 0) {
                const lab = LABOR_DB[line.labId];
                if (lab) labCost = (lab.dailyRate / 8) * parseFloat(line.labHrs);
            }
            return { matCost, labCost, total: matCost + labCost, unitStr };
        }

        function getLines(itemKey) {
            const lines = gridState[itemKey];
            return (lines && lines.length > 0) ? lines : [{ matId: '', matQty: '', labId: '', labHrs: '' }];
        }

        function renderGrid() {
            const tbody = document.getElementById('excel-grid-body');
            let html = '';
            const fmt = (num) => num > 0 ? num.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) : '-';

            SCOPE_CATEGORIES.forEach((cat, cIdx) => {
                html += `
                <tr class="bg-slate-700 text-white shadow-sm border-b-2 border-white">
                    <td colspan="11" class="p-2.5 font-bold text-xs uppercase tracking-widest pl-4">${cat.label}</td>
                </tr>`;
                
                cat.sections.forEach((sec, sIdx) => {
                    html += `
                    <tr class="bg-blue-100 text-blue-900 border-b border-blue-200">
                        <td colspan="11" class="p-2 pl-4 font-bold text-[11px] uppercase tracking-wide">${sec.title}</td>
                    </tr>`;
                    
                    sec.items.forEach((item, iIdx) => {
                        const itemKey = `${cat.id}__${sIdx}__${iIdx}`;
                        const code = cat.isIndirect ? item.code : `${cIdx+1}.${sIdx+1}.${iIdx+1}`;
                        const lines = getLines(itemKey);

                        lines.forEach((line, lIdx) => {
                            const lineKey = `${itemKey}__${lIdx}`;
                            const { matCost, labCost, total, unitStr } = computeLineCost(line);
                            const isLast = lIdx === lines.length - 1;

                            html += `<tr class="hover:bg-neutral-50 transition-colors border-b border-neutral-200 ${total > 0 ? 'bg-blue-50/40' : ''}" id="row-${lineKey}">`;

                            if (lIdx === 0) {
                                html += `
                                <td class="excel-cell readonly-cell text-center font-bold cursor-pointer" rowspan="${lines.length}" onclick="selectItem('${itemKey}')">${code}</td>
                                <td class="excel-cell readonly-cell font-medium text-neutral-900 cursor-pointer" rowspan="${lines.length}" title="${item.desc}" onclick="selectItem('${itemKey}')"><div class="truncate w-64">${item.desc}</div></td>`;
                            }

                            html += `
                                <td class="excel-cell bg-amber-50/20"><select id="sel-mat-${lineKey}" class="excel-select text-amber-900" onchange="updateLine('${itemKey}', ${lIdx}, 'matId', this.value)">${getMaterialOptionsHTML(line.matId)}</select></td>
                                <td class="excel-cell bg-amber-50/20"><input type="number" id="inp-matqty-${lineKey}" class="excel-input text-right text-amber-900 font-medium" min="0" step="any" placeholder="-" value="${line.matQty || ''}" oninput="updateLine('${itemKey}', ${lIdx}, 'matQty', this.value)"></td>
                                <td class="excel-cell readonly-cell text-center text-xs text-amber-700" id="txt-unit-${lineKey}">${unitStr}</td>
                                
                                <td class="excel-cell bg-blue-50/30"><select id="sel-lab-${lineKey}" class="excel-select text-blue-900" onchange="updateLine('${itemKey}', ${lIdx}, 'labId', this.value)">${getLaborOptionsHTML(line.labId)}</select></td>
                                <td class="excel-cell bg-blue-50/30"><input type="number" id="inp-labhrs-${lineKey}" class="excel-input text-right text-blue-900 font-medium" min="0" step="any" placeholder="-" value="${line.labHrs || ''}" oninput="updateLine('${itemKey}', ${lIdx}, 'labHrs', this.value)"></td>
                                
                                <td class="excel-cell readonly-cell text-right font-mono text-xs" id="txt-matcost-${lineKey}">${fmt(matCost)}</td>
                                <td class="excel-cell readonly-cell text-right font-mono text-xs" id="txt-labcost-${lineKey}">${fmt(labCost)}</td>
                                <td class="excel-cell readonly-cell text-right font-bold text-blue-700 bg-blue-50/50" id="txt-totalcost-${lineKey}">${fmt(total)}</td>
                                <td class="excel-cell readonly-cell text-center">
                                    <div class="flex items-center justify-center gap-1.5">
                                        <button onclick="removeLine('${itemKey}', ${lIdx})" class="text-neutral-300 hover:text-red-500 transition text-xs" title="Remove this line">✕</button>
                                        ${isLast ? `<button onclick="addLine('${itemKey}')" class="text-neutral-300 hover:text-blue-600 transition text-xs font-bold" title="Add another line to this item">+</button>` : ''}
                                    </div>
                                </td>
                            </tr>`;
                        });
                    });
                });
            });
            
            tbody.innerHTML = html;
            updateTotals();
        }

        function updateLine(itemKey, idx, field, value) {
            if (!gridState[itemKey]) gridState[itemKey] = [{ matId: '', matQty: '', labId: '', labHrs: '' }];
            if (!gridState[itemKey][idx]) gridState[itemKey][idx] = { matId: '', matQty: '', labId: '', labHrs: '' };
            gridState[itemKey][idx][field] = value;
            calculateLine(itemKey, idx);
            updateTotals();
            saveToCache();
            if (selectedItem === itemKey) renderBreakdownPanel();
        }

        function calculateLine(itemKey, idx) {
            const line = gridState[itemKey] && gridState[itemKey][idx];
            if (!line) return { matCost: 0, labCost: 0, total: 0 };

            const { matCost, labCost, total, unitStr } = computeLineCost(line);
            const lineKey = `${itemKey}__${idx}`;
            const fmt = (num) => num > 0 ? num.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) : '-';

            const elUnit = document.getElementById(`txt-unit-${lineKey}`);
            const elMatCost = document.getElementById(`txt-matcost-${lineKey}`);
            const elLabCost = document.getElementById(`txt-labcost-${lineKey}`);
            const elTotalCost = document.getElementById(`txt-totalcost-${lineKey}`);
            if (elUnit) elUnit.textContent = unitStr;
            if (elMatCost) elMatCost.textContent = fmt(matCost);
            if (elLabCost) elLabCost.textContent = fmt(labCost);
            if (elTotalCost) elTotalCost.textContent = fmt(total);

            const tr = document.getElementById(`row-${lineKey}`);
            if (tr) {
                if (total > 0) tr.classList.add('bg-blue-50/40');
                else tr.classList.remove('bg-blue-50/40');
            }

            return { matCost, labCost, total };
        }

        function addLine(itemKey) {
            if (!gridState[itemKey]) gridState[itemKey] = [{ matId: '', matQty: '', labId: '', labHrs: '' }];
            gridState[itemKey].push({ matId: '', matQty: '', labId: '', labHrs: '' });
            saveToCache();
            renderGrid();
            selectItem(itemKey);
        }

        function removeLine(itemKey, idx) {
            const lines = gridState[itemKey];
            if (!lines) return;
            if (lines.length <= 1) {
                delete gridState[itemKey]; // collapses back to a single blank placeholder line
            } else {
                lines.splice(idx, 1);
            }
            saveToCache();
            renderGrid();
            if (selectedItem === itemKey) renderBreakdownPanel();
        }

        function clearWorksheet() {
            if(confirm('Are you sure you want to clear the entire worksheet?')) {
                gridState = {};
                saveToCache();
                renderGrid();
                clearSelection();
                showToast('Worksheet cleared.', 'info');
            }
        }

        // ============================================================
        // 3. ITEM SELECTION, BREAKDOWN PANEL, TOTALS & CACHING
        // ============================================================

        function selectItem(itemKey) {
            selectedItem = itemKey;
            document.querySelectorAll('[id^="row-"]').forEach(el => el.classList.remove('ring-2', 'ring-inset', 'ring-blue-400'));
            document.querySelectorAll(`[id^="row-${itemKey}__"]`).forEach(el => el.classList.add('ring-2', 'ring-inset', 'ring-blue-400'));
            renderBreakdownPanel();
        }

        function clearSelection() {
            selectedItem = null;
            document.querySelectorAll('[id^="row-"]').forEach(el => el.classList.remove('ring-2', 'ring-inset', 'ring-blue-400'));
            document.getElementById('breakdown-empty').classList.remove('hidden');
            document.getElementById('breakdown-content').classList.add('hidden');
        }

        function renderBreakdownPanel() {
            if (!selectedItem) { clearSelection(); return; }

            const [catId, sIdx, iIdx] = selectedItem.split('__');
            const cat = SCOPE_CATEGORIES.find(c => c.id === catId);
            if (!cat) return;
            const sec = cat.sections[parseInt(sIdx)];
            const item = sec.items[parseInt(iIdx)];
            const cIdx = SCOPE_CATEGORIES.indexOf(cat);
            const code = cat.isIndirect ? item.code : `${cIdx+1}.${parseInt(sIdx)+1}.${parseInt(iIdx)+1}`;

            document.getElementById('breakdown-empty').classList.add('hidden');
            document.getElementById('breakdown-content').classList.remove('hidden');
            document.getElementById('breakdown-code').textContent = `WBS ${code}`;
            document.getElementById('breakdown-desc').textContent = item.desc;

            const lines = getLines(selectedItem);
            const fmt = (num) => `₱${num.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
            let subtotal = 0;
            let html = '';

            lines.forEach((line) => {
                if (!line.matId && !line.labId) return; // skip untouched placeholder lines
                const { matCost, labCost, total } = computeLineCost(line);
                subtotal += total;

                const matName = line.matId && MASTER_DB[line.matId] ? MASTER_DB[line.matId].name : null;
                const labName = line.labId && LABOR_DB[line.labId] ? LABOR_DB[line.labId].name : null;

                html += `<div class="p-2.5 bg-neutral-50 border border-neutral-100 rounded-lg text-xs space-y-1">`;
                if (matName) html += `<div class="flex justify-between text-neutral-600"><span class="truncate pr-2">${matName} × ${line.matQty || 0}</span><span class="font-medium text-neutral-900 flex-shrink-0">${fmt(matCost)}</span></div>`;
                if (labName) html += `<div class="flex justify-between text-neutral-600"><span class="truncate pr-2">${labName} × ${line.labHrs || 0}h</span><span class="font-medium text-neutral-900 flex-shrink-0">${fmt(labCost)}</span></div>`;
                html += `</div>`;
            });

            document.getElementById('breakdown-lines').innerHTML = html || '<p class="text-xs text-neutral-400 text-center py-4">No material or labor added to this item yet.</p>';
            document.getElementById('breakdown-subtotal').textContent = fmt(subtotal);
        }

        // The full Financial Ledger (Undefined Allowances, Contingency, Grand Total) is moving
        // to calculator.html per Sir Tony's direction. CES now only tracks its own Defined Cost
        // subtotal quietly in the background and hands it off via cross-page storage.
        function updateTotals() {
            let definedCost = 0;
            Object.keys(gridState).forEach(itemKey => {
                (gridState[itemKey] || []).forEach((line) => {
                    definedCost += computeLineCost(line).total;
                });
            });

            localStorage.setItem('urc_ccc_ces_ready', String(definedCost > 0));
            try {
                localStorage.setItem('urc_ces_cross_page', JSON.stringify({ definedCost, updatedAt: Date.now() }));
            } catch(e) {}
        }

        function saveToCache() {
            try { localStorage.setItem('urc_ces_grid_state', JSON.stringify(gridState)); } catch(e) {}
        }

        function loadFromCache() {
            try {
                const raw = localStorage.getItem('urc_ces_grid_state');
                if (!raw) return;
                const parsed = JSON.parse(raw);
                // Defensive: only accept entries already in the new array-per-item shape.
                // Old single-object-per-row caches (pre multi-line) are dropped instead of crashing the page.
                Object.keys(parsed).forEach(key => {
                    if (Array.isArray(parsed[key])) gridState[key] = parsed[key];
                });
            } catch(e) {}
        }

        function updateMeta(field, value) {
            estimateMeta[field] = value;
            try { localStorage.setItem('urc_ces_meta', JSON.stringify(estimateMeta)); } catch(e) {}
        }

        function loadMeta() {
            try {
                const raw = localStorage.getItem('urc_ces_meta');
                if (raw) estimateMeta = { ...estimateMeta, ...JSON.parse(raw) };
            } catch(e) {}
            const map = { project: 'meta-project', plant: 'meta-plant', type: 'meta-type', preparedBy: 'meta-preparedby', date: 'meta-date', meanSpendingDate: 'meta-meanspend' };
            Object.keys(map).forEach(field => {
                const el = document.getElementById(map[field]);
                if (el && estimateMeta[field]) el.value = estimateMeta[field];
            });
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'px-4 py-3 rounded-xl shadow-lg border text-sm font-semibold flex items-center gap-3 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto max-w-sm w-full bg-white';
            if (type === 'error') toast.classList.add('bg-rose-50','border-rose-100','text-rose-800');
            else if (type === 'info') toast.classList.add('bg-slate-50','border-neutral-100','text-slate-800');
            else toast.classList.add('border-neutral-200','text-neutral-900');
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2','opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0','scale-95'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        // ============================================================
        // 4. EXCEL EXPORT (Adapted for Grid State)
        // ============================================================

        function exportToExcelBOQ() {
            const estDate = estimateMeta.date
                ? new Date(estimateMeta.date + 'T00:00:00').toLocaleDateString('en-US', {month: 'long', day: '2-digit', year: 'numeric'})
                : new Date().toLocaleDateString('en-US', {month: 'long', day: '2-digit', year: 'numeric'});

            const borderAll = { top: {style: 'thin'}, bottom: {style: 'thin'}, left: {style: 'thin'}, right: {style: 'thin'} };
            const fontArial = { name: "Arial", sz: 11 };
            const fontBold = { name: "Arial", sz: 11, bold: true };
            const fontHeader = { name: "Arial", sz: 14, bold: true };
            
            const colorHeader = "D9E1F2"; 
            const colorCat    = "E7E6E6"; 
            const colorItem   = "FFF2CC"; 
            const colorDirect = "E2EFDA"; 
            const colorLump   = "B4C6E7"; 
            
            const stTitleRow       = { font: fontHeader };
            const stMetaLabel      = { font: fontBold };
            const stMetaValue      = { font: fontArial };

            const stHeader         = { font: fontBold, fill: {fgColor: {rgb: colorHeader}}, alignment: {horizontal: "center", vertical: "center"}, border: borderAll };
            const stCatCenter      = { font: fontBold, fill: {fgColor: {rgb: colorCat}}, alignment: {horizontal: "center", vertical: "center"}, border: borderAll };
            const stCatLeft        = { font: fontBold, fill: {fgColor: {rgb: colorCat}}, alignment: {horizontal: "left", vertical: "center"}, border: borderAll };
            
            const stItemCenterBold = { font: fontBold, fill: {fgColor: {rgb: colorItem}}, alignment: {horizontal: "center", vertical: "center"}, border: borderAll };
            const stItemLeftBold   = { font: fontBold, fill: {fgColor: {rgb: colorItem}}, alignment: {horizontal: "left", vertical: "center"}, border: borderAll };
            const stItemRightBold  = { font: fontBold, fill: {fgColor: {rgb: colorItem}}, alignment: {horizontal: "right", vertical: "center"}, border: borderAll, z: '#,##0.00' };

            const stSubCenter      = { font: fontBold, fill: {fgColor: {rgb: colorHeader}}, alignment: {horizontal: "center", vertical: "center"}, border: borderAll };
            const stSubRight       = { font: fontBold, fill: {fgColor: {rgb: colorHeader}}, alignment: {horizontal: "right", vertical: "center"}, border: borderAll, z: '#,##0.00' };
            const stDirCenter      = { font: fontBold, fill: {fgColor: {rgb: colorDirect}}, alignment: {horizontal: "center", vertical: "center"}, border: borderAll };
            const stDirRight       = { font: fontBold, fill: {fgColor: {rgb: colorDirect}}, alignment: {horizontal: "right", vertical: "center"}, border: borderAll, z: '#,##0.00' };
            const stLumpCenter     = { font: fontBold, fill: {fgColor: {rgb: colorLump}}, alignment: {horizontal: "center", vertical: "center"}, border: borderAll };
            const stLumpRight      = { font: fontBold, fill: {fgColor: {rgb: colorLump}}, alignment: {horizontal: "right", vertical: "center"}, border: borderAll, z: '#,##0.00' };

            const c = (val, style) => {
                if (val === 0 || !val) return { v: '-', t: 's', s: style };
                return { v: val, t: typeof val === 'number' ? 'n' : 's', s: style };
            };
            const cStr = (val, style) => ({ v: val || '', t: 's', s: style });

            const ws_data = [
                [cStr('ENGINEERING ESTIMATE TEMPLATE', stTitleRow)],
                [],
                [cStr('PROJECT TITLE', stMetaLabel), cStr(estimateMeta.project || 'Untitled Estimate', stMetaValue), '', '', '', cStr('Date', stMetaLabel), cStr(estDate, stMetaValue)],
                [cStr('PLANT', stMetaLabel), cStr(estimateMeta.plant || '-', stMetaValue), '', '', '', cStr('Prepared by', stMetaLabel), cStr(estimateMeta.preparedBy || '-', stMetaValue)],
                [],
                [
                    { v: 'ITEM NO.', t: 's', s: stHeader }, { v: 'SCOPE DESCRIPTION', t: 's', s: stHeader }, { v: 'QTY', t: 's', s: stHeader }, { v: 'UNIT', t: 's', s: stHeader }, 
                    { v: 'MAN HOUR', t: 's', s: stHeader }, { v: 'LABOR COST (Php)', t: 's', s: stHeader }, { v: 'MATERIALS COST (Php)', t: 's', s: stHeader }, { v: 'TOTAL COST', t: 's', s: stHeader }
                ]
            ];

            let merges = [];
            merges.push({s: {r: 0, c: 0}, e: {r: 0, c: 3}});

            let currentRow = 6; 

            let grandDirectTotal = 0, grandDirectManHours = 0, grandDirectLabor = 0, grandDirectMat = 0;
            let grandIndirectTotal = 0, grandIndirectManHours = 0, grandIndirectLabor = 0, grandIndirectMat = 0;
            let indirectRows = [];

            SCOPE_CATEGORIES.forEach((cat, cIdx) => {
                let catTotal = 0, catManHours = 0, catLabor = 0, catMat = 0;
                let hasCategoryData = false;
                let catRows = [];
                const catLetter = String.fromCharCode(65 + cIdx);

                cat.sections.forEach((sec, sIdx) => {
                    sec.items.forEach((item, iIdx) => {
                        const itemKey = `${cat.id}__${sIdx}__${iIdx}`;
                        // An item can have multiple lines (multiple material/labor combos) — export one row per line.
                        const lines = (gridState[itemKey] || []).filter(l => (l.matId && parseFloat(l.matQty) > 0) || (l.labId && parseFloat(l.labHrs) > 0));
                        if (lines.length === 0) return;

                        hasCategoryData = true;
                        const code = cat.isIndirect ? item.code : `${cIdx+1}.${sIdx+1}.${iIdx+1}`;

                        lines.forEach((s) => {
                            let matCost = 0, labCost = 0, matUnit = '-';
                            if (s.matId && parseFloat(s.matQty) > 0) {
                                const m = MASTER_DB[s.matId];
                                matCost = m.price * parseFloat(s.matQty);
                                matUnit = m.unit;
                            }
                            if (s.labId && parseFloat(s.labHrs) > 0) {
                                const l = LABOR_DB[s.labId];
                                labCost = (l.dailyRate / 8) * parseFloat(s.labHrs);
                            }

                            const total = matCost + labCost;
                            const hrs = s.labHrs ? parseFloat(s.labHrs) : 0;
                            const mQty = s.matQty ? parseFloat(s.matQty) : 0;

                            catTotal += total; catManHours += hrs; catLabor += labCost; catMat += matCost;

                            catRows.push([
                                cStr(code, stItemCenterBold),
                                cStr(item.desc, stItemLeftBold),
                                c(mQty, stItemCenterBold),
                                cStr(matUnit, stItemCenterBold),
                                c(hrs, stItemRightBold),
                                c(labCost, stItemRightBold),
                                c(matCost, stItemRightBold),
                                c(total, stItemRightBold)
                            ]);
                        });
                    });
                });

                if (hasCategoryData) {
                    if (cat.isIndirect) {
                        indirectRows.push(...catRows);
                        grandIndirectTotal += catTotal; grandIndirectManHours += catManHours;
                        grandIndirectLabor += catLabor; grandIndirectMat += catMat;
                    } else {
                        ws_data.push([
                            c(catLetter, stCatCenter), c(cat.label.toUpperCase(), stCatLeft), c('', stCatLeft), c('', stCatLeft), c('', stCatLeft), c('', stCatLeft), c('', stCatLeft), c('', stCatLeft)
                        ]);
                        merges.push({s: {r: currentRow, c: 1}, e: {r: currentRow, c: 7}}); 
                        currentRow++;

                        ws_data.push(...catRows);
                        currentRow += catRows.length;

                        ws_data.push([
                            c('SUB TOTAL', stSubCenter), c('', stSubCenter), c('', stSubCenter), c('', stSubCenter), 
                            c(catManHours, stSubRight), c(catLabor, stSubRight), c(catMat, stSubRight), c(catTotal, stSubRight)
                        ]);
                        merges.push({s: {r: currentRow, c: 0}, e: {r: currentRow, c: 3}}); 
                        currentRow++;
                        
                        grandDirectTotal += catTotal; grandDirectManHours += catManHours;
                        grandDirectLabor += catLabor; grandDirectMat += catMat;
                    }
                }
            });

            if (grandDirectTotal > 0) {
                ws_data.push([
                    c('TOTAL DIRECT COST', stDirCenter), c('', stDirCenter), c('', stDirCenter), c('', stDirCenter), 
                    c(grandDirectManHours, stDirRight), c(grandDirectLabor, stDirRight), c(grandDirectMat, stDirRight), c(grandDirectTotal, stDirRight)
                ]);
                merges.push({s: {r: currentRow, c: 0}, e: {r: currentRow, c: 3}});
                currentRow++;
            }
            
            if (grandIndirectTotal > 0) {
                ws_data.push(...indirectRows);
                currentRow += indirectRows.length;

                ws_data.push([
                    c('TOTAL INDIRECT COST', stDirCenter), c('', stDirCenter), c('', stDirCenter), c('', stDirCenter), 
                    c(grandIndirectManHours, stDirRight), c(grandIndirectLabor, stDirRight), c(grandIndirectMat, stDirRight), c(grandIndirectTotal, stDirRight)
                ]);
                merges.push({s: {r: currentRow, c: 0}, e: {r: currentRow, c: 3}});
                currentRow++;
            }

            const lumpsumTotal = grandDirectTotal + grandIndirectTotal;
            const lumpsumManHours = grandDirectManHours + grandIndirectManHours;
            const lumpsumLabor = grandDirectLabor + grandIndirectLabor;
            const lumpsumMat = grandDirectMat + grandIndirectMat;

            if (lumpsumTotal > 0) {
                ws_data.push([
                    c('TOTAL LUMPSUM COST', stLumpCenter), c('', stLumpCenter), c('', stLumpCenter), c('', stLumpCenter), 
                    c(lumpsumManHours, stLumpRight), c(lumpsumLabor, stLumpRight), c(lumpsumMat, stLumpRight), c(lumpsumTotal, stLumpRight)
                ]);
                merges.push({s: {r: currentRow, c: 0}, e: {r: currentRow, c: 3}});
            }

            const ws = window.XLSX.utils.aoa_to_sheet(ws_data);
            ws['!merges'] = merges;
            ws['!cols'] = [{wch: 10}, {wch: 45}, {wch: 8}, {wch: 8}, {wch: 12}, {wch: 18}, {wch: 22}, {wch: 18}];
            
            const wb = window.XLSX.utils.book_new();
            window.XLSX.utils.book_append_sheet(wb, ws, "Field Cost Estimate");
            window.XLSX.writeFile(wb, "URC_Worksheet_Export.xlsx");
        }
    </script>
</body>
</html>
